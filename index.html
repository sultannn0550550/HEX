<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="محول HEX"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>محول HEX و Decimal</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:white;margin:0;padding:env(safe-area-inset-top) 18px 30px}main{max-width:480px;margin:45px auto}h1{font-size:27px}p{color:#aab6cb}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button{flex:1}button,input{font:inherit;border-radius:13px;padding:15px}button{background:#243247;color:white;border:1px solid #40516a}.active,.copy{background:#2563eb;border-color:#2563eb}input{width:100%;box-sizing:border-box;background:#172235;border:1px solid #526078;color:white;font-size:27px;direction:ltr;text-align:center}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.result{background:#172235;border-radius:14px;padding:15px;min-width:0}.result small{color:#aab6cb}.result strong{display:block;font-size:27px;overflow-wrap:anywhere;direction:ltr;text-align:left;margin-top:8px}.copy{width:100%}#error{color:#ff9d9d;min-height:24px}</style></head><body><main><h1>محول HEX ↔ Decimal</h1><p>أدخل الرقم وتظهر النتيجتان مباشرة، بدون إنترنت.</p><div class="tabs"><button id="hex" class="active">إدخال HEX</button><button id="dec">إدخال Decimal</button></div><input id="number" placeholder="29" autocomplete="off" autocapitalize="characters" spellcheck="false"><div id="error"></div><div class="results"><div class="result"><small>HEX</small><strong id="outhex">—</strong></div><div class="result"><small>Decimal</small><strong id="outdec">—</strong></div></div><button class="copy" id="copy">نسخ النتيجة</button></main><script>let base=16;const n=document.getElementById('number'),oh=document.getElementById('outhex'),od=document.getElementById('outdec'),err=document.getElementById('error');function update(){let s=n.value.trim().replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c)));let ok=base===16?/^(?:0x)?[0-9a-f]+$/i.test(s):/^[0-9]+$/.test(s);try{if(!ok){oh.textContent=od.textContent='—';err.textContent=s?'رقم غير صالح':'';return}let v=BigInt(base===16?(s.toLowerCase().startsWith('0x')?s:'0x'+s):s);oh.textContent=v.toString(16).toUpperCase();od.textContent=v.toString(10);err.textContent=''}catch{err.textContent='رقم غير صالح'}}document.getElementById('hex').onclick=()=>{base=16;document.getElementById('hex').classList.add('active');document.getElementById('dec').classList.remove('active');n.placeholder='29';update()};document.getElementById('dec').onclick=()=>{base=10;document.getElementById('dec').classList.add('active');document.getElementById('hex').classList.remove('active');n.placeholder='41';update()};n.addEventListener('input',update);document.getElementById('copy').onclick=async()=>{if(oh.textContent==='—')return;let t=`HEX: ${oh.textContent}\nDecimal: ${od.textContent}`;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='تم النسخ ✓';setTimeout(()=>document.getElementById('copy').textContent='نسخ النتيجة',1600)}catch{prompt('انسخ النتيجة:',t)}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
